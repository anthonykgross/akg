schema_version: "1.1"
name: team-show
tags: [team]
execution:
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: shows-rules
    type: regex
    pattern: "Every PR links its Jira ticket"
  - name: keeps-commands-verbatim
    type: regex
    pattern: "claude mcp add --transport http atlassian https://mcp\\.atlassian\\.com/v1/sse"
  - name: display-only
    type: tool_used
    tool: Bash
    input_match: "brew|mcp add|gh auth login"
    min: 0
    max: 0
  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
