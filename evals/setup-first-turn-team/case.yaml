schema_version: "1.1"
name: setup-first-turn-team
tags: [setup, first-turn, team]
execution:
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: reads-rules
    type: tool_used
    tool: Read
    input_match: "references/rules\\.md"
  # The guessed team source is fetched before the first question, while fetch.sh is pre-approved.
  - name: fetches-guessed-team
    type: tool_used
    tool: Bash
    input_match: "scripts/fetch\\.sh \\.\\./team"
  - name: guess-is-team
    type: regex
    pattern: "\\.\\./team"
  - name: checks-mcp-first-turn
    type: tool_used
    tool: Bash
    input_match: "\"command\":\"claude mcp list\""
  - name: no-shell-reads
    type: regex
    target: trace
    pattern: "\"command\":\"(cd |cat |ls |find )"
    match: not_contains
  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: one-question-guess-team
    type: llm
    criteria: >-
      The message asks exactly one question: which team config to extend. Answer 1 is Claude's
      guess, ../team, with its evidence (a sibling folder with .claude/akg/). No other question is asked yet.
