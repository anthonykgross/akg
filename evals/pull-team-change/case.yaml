schema_version: "1.1"
name: pull-team-change
tags: [pull, team]
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  # Team v2 is committed with a fixed date, so its SHA is stable; any 40-hex value
  # other than v1 is checked by the llm grader below.
  - name: snapshot-used
    type: tool_used
    tool: Bash
    input_match: "scripts/snapshot\\.sh"
  # Only the update writes `synced`: the setup-done file is laid out by the scaffold.
  - name: synced-moves
    type: regex
    target: trace
    pattern: '"file_path":"[^"]*/\.claude/akg/config\.yaml"(?:,"\w+":(?:"(?:[^"\\]|\\.)*"|true|false))*?,"(?:content|new_string)":"(?:[^"\\]|\\.)*synced: [0-9a-f]{40}'
  # The project overrides workflow.review (light); the team moves to strict: conflict, keep local.
  - name: keeps-local-review
    type: regex
    target: trace
    pattern: '"file_path":"[^"]*/\.claude/akg/config\.yaml"(?:,"\w+":(?:"(?:[^"\\]|\\.)*"|true|false))*?,"(?:content|new_string)":"(?:[^"\\]|\\.)*review: (?:\\"|'')?strict'
    match: not_contains
  # Unattended run: the conflict list may be folded into the final report.
  - name: reports-kept-local
    type: llm
    criteria: >-
      The reply tells the user that the project's own review level (light) was kept rather than
      the team's new value.
  - name: dod-gets-changelog
    type: regex
    target: { source: file, path: CLAUDE.md }
    pattern: "changelog"
    flags: i
  - name: project-context-untouched
    type: regex
    target: { source: file, path: CLAUDE.md }
    pattern: "## Project context\\n\\n- Minimal React app \\(Vite\\); single component in src/App\\.jsx\\n"
  - name: new-deny-merged
    type: regex
    target: trace
    pattern: '"file_path":"[^"]*/\.claude/settings\.json"(?:,"\w+":(?:"(?:[^"\\]|\\.)*"|true|false))*?,"(?:content|new_string)":"(?:[^"\\]|\\.)*curl \* \| sh'
  # akg never removes settings: a full rewrite of settings.json keeps the enabled plugins.
  - name: settings-nothing-removed
    type: regex
    target: trace
    pattern: '"file_path":"[^"]*/\.claude/settings\.json","content":"(?!(?:[^"\\]|\\.)*react-conventions@acme-team)'
    match: not_contains
  - name: team-md-diff-shown
    type: regex
    target: trace
    pattern: "Every PR links its Jira ticket"
  - name: missing-tool-listed
    type: regex
    target: trace
    pattern: "! brew install glow"
  - name: never-runs-team-commands
    type: tool_used
    tool: Bash
    input_match: "brew install|mcp add"
    min: 0
    max: 0
